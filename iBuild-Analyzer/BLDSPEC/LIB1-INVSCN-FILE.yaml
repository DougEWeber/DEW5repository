      - LIB1-INVMSTL1-FILE
      - LIB1-VNDMSTL1-FILE
    command: EDOCRTOBJ
    parameters:
      - "BLDTGT($(LIB1)/INVSCN)"
      - "OBJTYPE(*FILE)"
      - "OBJATTR(DSPF)"
      - "CMD(CRTDSPF)"
      - "CMDPARMS(' FILE($(LIB1)/INVSCN) SRCFILE(QDDSSRC) SRCMBR(INVSCN) DFRWRT(*YES) RSTDSP(*NO) TEXT(''Inventory Master Maintenance'')')"
  LIBL-QDDSSRC-SRCMBR-INVSCN :
    objlib: "*LIBL"
    objname: QDDSSRC
    objtype: SRCMBR
    mbrname: INVSCN
